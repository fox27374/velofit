services:
  db:
    image: docker.io/library/postgres:16
    environment:
      POSTGRES_USER: bikedb
      POSTGRES_DB: bikedb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bikedb -d bikedb"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  bikedb:
    image: ghcr.io/fox27374/bikedb:${BIKEDB_TAG:-latest}
    environment:
      DATABASE_URL: postgres://bikedb:${POSTGRES_PASSWORD}@db:5432/bikedb?sslmode=disable
      ADDR: :8080
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  velofit:
    image: ghcr.io/fox27374/velofit:${VELOFIT_TAG:-latest}
    ports:
      - "8081:80"
    depends_on:
      - bikedb
    restart: unless-stopped

volumes:
  pgdata: {}
