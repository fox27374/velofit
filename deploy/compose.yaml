services:
  db:
    image: docker.io/library/postgres:16
    environment:
      POSTGRES_USER: bikedb
      POSTGRES_DB: bikedb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bikedb -d bikedb"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # The bikedb API, and the only service with DATABASE_URL. The name stays
  # `bikedb` because the Caddyfile baked into the velofit image proxies
  # /api/* to bikedb:8080. Its :8090 write surface is never published.
  bikedb:
    image: ghcr.io/fox27374/bikedb-api:${BIKEDB_TAG:-latest}
    environment:
      DATABASE_URL: postgres://bikedb:${POSTGRES_PASSWORD}@db:5432/bikedb?sslmode=disable
      BIKEDB_INTERNAL_TOKEN: ${BIKEDB_INTERNAL_TOKEN:?set in .env}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  bikedb-scraper:
    image: ghcr.io/fox27374/bikedb-scraper:${BIKEDB_TAG:-latest}
    environment:
      BIKEDB_API_URL: http://bikedb:8090
      BIKEDB_INTERNAL_TOKEN: ${BIKEDB_INTERNAL_TOKEN:?set in .env}
    depends_on:
      bikedb:
        condition: service_healthy
    restart: unless-stopped

  bikedb-web:
    image: ghcr.io/fox27374/bikedb-web:${BIKEDB_TAG:-latest}
    environment:
      BIKEDB_API_URL: http://bikedb:8090
      BIKEDB_INTERNAL_TOKEN: ${BIKEDB_INTERNAL_TOKEN:?set in .env}
    ports:
      - "8082:8082"
    depends_on:
      bikedb:
        condition: service_healthy
    restart: unless-stopped

  velofit:
    image: ghcr.io/fox27374/velofit:${VELOFIT_TAG:-latest}
    ports:
      - "8081:80"
    depends_on:
      - bikedb
    restart: unless-stopped

volumes:
  pgdata: {}
